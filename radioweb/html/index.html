<!DOCTYPE html>
<html>
<head>
    <title>Car Radio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(20px); opacity: 0; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-slide-out { animation: slideOut 0.3s ease-in forwards; }
    </style>
</head>
<body>
    <div id="radio-ui" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 w-full max-w-3xl bg-gray-900/70 backdrop-blur rounded-2xl shadow-2xl p-6 text-white border border-gray-800/60">
        <div class="flex items-start gap-3 mb-4">
            <div class="flex-1">
                <p class="text-sm uppercase tracking-[0.2em] text-amber-400">Radio Deck</p>
                <h2 class="text-3xl font-extrabold leading-tight">Drive Audio</h2>
                <p id="song-title" class="text-sm text-gray-300 mt-1">Song: Unknown</p>
            </div>
            <div class="flex gap-2">
                <button id="stop-btn" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-red-600 text-sm font-semibold transition-colors">Stop</button>
                <button id="close-btn" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold transition-colors">✕</button>
            </div>
        </div>

        <div class="mb-4">
            <label for="volume-slider" class="text-xs uppercase text-gray-400 tracking-wide">Volume</label>
            <div class="flex items-center gap-3 mt-1">
                <input id="volume-slider" type="range" min="0" max="100" value="100" class="flex-1 accent-amber-500">
                <span id="volume-value" class="text-sm text-gray-200 w-12 text-right">100%</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800/70 border border-gray-700 rounded-xl p-4">
                <p class="text-xs uppercase text-gray-400 tracking-wide mb-2">Stations</p>
                <div class="relative mb-3">
                    <select id="radio-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none hover:bg-gray-800 transition-colors">
                        <option value="0">Turn Off</option>
                    </select>
                </div>
                <button id="select-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2.5 rounded-lg transition-colors">Play Selected</button>
            </div>

            <div class="bg-gray-800/70 border border-gray-700 rounded-xl p-4">
                <p class="text-xs uppercase text-gray-400 tracking-wide mb-2">Quick Play</p>
                <div class="space-y-3">
                    <input id="custom-name" type="text" placeholder="Track Title" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <input id="custom-url" type="text" placeholder="YouTube / SoundCloud / .mp3 URL" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <button id="custom-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2.5 rounded-lg transition-colors">Play Once</button>
                </div>
            </div>
        </div>

        <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800/70 border border-gray-700 rounded-xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <p class="text-xs uppercase text-gray-400 tracking-wide">New Custom Station</p>
                    <span class="text-xs text-gray-500">Playlist builder</span>
                </div>
                <input id="station-name" type="text" placeholder="Station Name" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                <div class="flex items-center gap-2">
                    <input id="station-public" type="checkbox" class="h-4 w-4 text-amber-500 bg-gray-900 border-gray-700 rounded">
                    <label for="station-public" class="text-sm text-gray-300">Public station</label>
                </div>
                <p class="text-sm text-gray-400">Create the station first, then use “Manage Tracks” to add songs.</p>
                <button id="save-station" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-lg transition-colors">Create Station</button>
            </div>

            <div class="bg-gray-800/70 border border-gray-700 rounded-xl p-4 max-h-80 overflow-y-auto">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs uppercase text-gray-400 tracking-wide">My Stations</p>
                    <span class="text-xs text-gray-500">Public + Private</span>
                </div>
                <div id="custom-list" class="space-y-2">
                    <p class="text-gray-400 text-sm">No custom stations yet.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Manage Tracks Modal -->
    <div id="manage-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-xl shadow-2xl p-6 text-white">
            <div class="flex items-start justify-between mb-4">
                <div>
                    <p class="text-xs uppercase text-amber-400 tracking-[0.2em]">Manage Tracks</p>
                    <h3 id="manage-title" class="text-2xl font-bold">Station</h3>
                </div>
                <button id="manage-close" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold transition-colors">✕</button>
            </div>
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input id="manage-track-title" type="text" placeholder="Track title" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <input id="manage-track-url" type="text" placeholder="Track URL" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div class="flex gap-2">
                    <button id="manage-save-track" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2 rounded-lg transition-colors">Save Track</button>
                    <button id="manage-new-track" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold transition-colors">New</button>
                </div>
                <div class="max-h-72 overflow-y-auto border border-gray-800 rounded-lg">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-800 text-gray-300">
                            <tr>
                                <th class="px-3 py-2 text-left">#</th>
                                <th class="px-3 py-2 text-left">Title</th>
                                <th class="px-3 py-2 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="manage-track-list" class="divide-y divide-gray-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Mini Now Playing -->
    <div id="now-playing" class="hidden fixed bottom-4 right-4 w-80 bg-gray-900/80 backdrop-blur border border-gray-800/60 rounded-xl shadow-xl p-4 text-white animate-slide-in">
        <div class="flex items-start gap-3">
            <div class="flex-1">
                <p class="text-[11px] uppercase tracking-[0.2em] text-amber-400">Now Playing</p>
                <p id="np-title" class="text-sm font-semibold leading-tight truncate">Unknown</p>
                <p id="np-station" class="text-[12px] text-gray-400 truncate mt-1">Station</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
